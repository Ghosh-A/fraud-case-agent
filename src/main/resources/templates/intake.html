<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>New fraud case intake</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <h1>Fraud case intake</h1>
    <p class="note">Masked/tokenised references only — no card or account numbers. All data is synthetic.</p>
    <div th:replace="~{fragments :: flash}"></div>
    <p th:if="${error}" class="flash err" th:text="${error}"></p>
    <form th:action="@{/cases}" method="post" class="form">
        <fieldset>
            <legend>Customer</legend>
            <label for="maskedCustomerRef">Masked customer reference</label>
            <input id="maskedCustomerRef" name="maskedCustomerRef" required placeholder="CUST-••••-4821">
            <label for="homeRegion">Home region</label>
            <input id="homeRegion" name="homeRegion" placeholder="IN-KA">
        </fieldset>
        <fieldset>
            <legend>Transaction</legend>
            <label for="transactionRef">Transaction reference</label>
            <input id="transactionRef" name="transactionRef" required placeholder="TXN-SCN-UNAUTH-001">
            <label for="amount">Amount</label>
            <input id="amount" name="amount" type="number" step="0.01" min="0.01" required>
            <label for="currency">Currency</label>
            <input id="currency" name="currency" required maxlength="3" pattern="[A-Z]{3}" value="INR">
            <label for="occurredAt">Occurred at (ISO)</label>
            <input id="occurredAt" name="occurredAt" required value="2026-11-06T08:42:00+05:30">
            <label for="status">Status</label>
            <select id="status" name="status">
                <option>POSTED</option><option>PENDING</option><option>SETTLED</option><option>REVERSED</option>
            </select>
            <label for="channel">Channel</label>
            <select id="channel" name="channel">
                <option>CARD_NOT_PRESENT</option><option>CARD_PRESENT</option>
                <option>ONLINE</option><option>MOBILE</option><option>ATM</option>
            </select>
            <label for="maskedMerchant">Masked merchant</label>
            <input id="maskedMerchant" name="maskedMerchant" required placeholder="NORTHSTAR DIGITAL ••••73">
        </fieldset>
        <fieldset>
            <legend>Claim</legend>
            <label for="issueType">Issue type</label>
            <select id="issueType" name="issueType">
                <option>MERCHANT_NOT_RECOGNISED</option><option>UNAUTHORISED_USE</option>
                <option>FULFILMENT</option><option>CANCELLATION</option>
                <option>AMOUNT_DISPUTE</option><option>DUPLICATE_CHARGE</option><option>OTHER</option>
            </select>
            <label for="cardPossession">Card possession</label>
            <select id="cardPossession" name="cardPossession">
                <option>HAS_CARD</option><option>LOST</option><option>STOLEN</option><option>UNKNOWN</option>
            </select>
            <label for="merchantRecognised">Merchant recognised?</label>
            <select id="merchantRecognised" name="merchantRecognised">
                <option value="false">No</option><option value="true">Yes</option>
            </select>
            <label for="customerStatement">Customer statement</label>
            <textarea id="customerStatement" name="customerStatement" required maxlength="2000"
                      placeholder="I do not recognise this purchase and still have my card."></textarea>
        </fieldset>
        <fieldset>
            <legend>Consent / control</legend>
            <input type="hidden" name="intakeChannel" value="WEB">
            <input type="hidden" name="reportedAt" id="reportedAt">
            <label><input type="checkbox" name="syntheticDataConfirmed" value="true" required>
                I confirm all data is synthetic</label>
            <label><input type="checkbox" name="reviewRequired" value="true" required checked disabled
                          onchange="this.checked=true">
                Human review required (always)</label>
            <input type="hidden" name="reviewRequired" value="true">
        </fieldset>
        <button type="submit" class="button">Create case</button>
    </form>
</main>
<script>
    document.getElementById('reportedAt').value = new Date().toISOString();
</script>
</body>
</html>
